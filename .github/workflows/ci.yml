name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - run: npm test
      - run: npm run vendor:check
