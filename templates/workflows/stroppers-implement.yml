# Turns an issue labeled ready-for-agent into a gated PR.
# Installed by stroppers-init. Add your test suite's setup where marked.
name: stroppers implement

on:
  issues:
    types: [labeled]

concurrency:
  group: stroppers-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  implement:
    if: github.event.label.name == 'ready-for-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.STROPPERS_APP_CLIENT_ID }}
          private-key: ${{ secrets.STROPPERS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-actions: read
          permission-checks: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      # Setup your test suite needs goes here: runtimes, dependencies, services.

      - uses: sogamoso/stroppers/actions/agent@__STROPPERS_REF__
        with:
          mode: implement
          number: ${{ github.event.issue.number }}
          github_token: ${{ steps.app.outputs.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ vars.STROPPERS_APP_SLUG }}
          auto_merge: "false"
